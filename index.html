<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>דשבורד מודיעין קבוצות וואטסאפ — הנהלת חשבשבת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f7; --card:#ffffff; --ink:#16202e; --muted:#64748b; --line:#e2e8f0;
    --brand:#0E98E3; --brand-dark:#0a6fa8;
    --pos:#16a34a; --pos-bg:#dcfce7; --neg:#dc2626; --neg-bg:#fee2e2;
    --mix:#d97706; --mix-bg:#fef3c7; --neu:#64748b; --neu-bg:#e2e8f0;
    --purple:#7c3aed; --teal:#0d9488; --rose:#e11d48; --amber:#f59e0b;
    --shadow:0 1px 3px rgba(16,32,46,.08),0 8px 24px rgba(16,32,46,.06);
    --shadow-lg:0 12px 40px rgba(16,32,46,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Assistant','Heebo','Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1280px;margin:0 auto;padding:0 20px 80px}
  header.top{background:linear-gradient(135deg,#0a6fa8 0%,#0E98E3 55%,#36b3f0 100%);color:#fff;padding:38px 0 30px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
  header.top::after{content:"";position:absolute;left:-60px;top:-60px;width:280px;height:280px;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);border-radius:50%}
  .head-inner{max-width:1280px;margin:0 auto;padding:0 20px;position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:28px}
  .head-text{min-width:0}
  .head-logos{display:flex;gap:14px;align-items:center;flex:0 0 auto}
  .head-logos img{height:70px;width:auto;box-sizing:border-box;background:#fff;border-radius:12px;padding:5px;box-shadow:0 6px 18px rgba(0,0,0,.20)}
  .eyebrow{font-size:14px;font-weight:700;letter-spacing:.5px;opacity:.9;display:flex;align-items:center;gap:8px}
  h1.title{font-family:'Heebo',sans-serif;font-size:34px;font-weight:900;margin:6px 0 4px;line-height:1.15}
  .subtitle{font-size:16px;opacity:.92;font-weight:400}
  .head-meta{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;font-size:14px}
  .head-meta span{background:rgba(255,255,255,.15);padding:6px 14px;border-radius:30px;backdrop-filter:blur(4px);font-weight:600}
  .cmp-link{display:inline-block;margin-top:14px;background:#fff;color:#0a6fa8;text-decoration:none;font-weight:800;font-size:14.5px;padding:11px 20px;border-radius:30px;box-shadow:0 6px 18px rgba(0,0,0,.18);transition:.15s}
  .cmp-link:hover{transform:translateY(-1px);box-shadow:0 9px 24px rgba(0,0,0,.24)}
  .kpis{display:grid;gap:16px;margin:-28px 0 30px;position:relative;z-index:5}
  .kpi{background:var(--card);border-radius:16px;padding:20px 18px;box-shadow:var(--shadow);border-top:4px solid var(--brand);text-align:center}
  .kpi .num{font-family:'Heebo',sans-serif;font-size:32px;font-weight:900;line-height:1}
  .kpi .lbl{font-size:13px;color:var(--muted);margin-top:7px;font-weight:600}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;position:sticky;top:0;background:var(--bg);padding:14px 0;z-index:20;border-bottom:1px solid var(--line)}
  .tab{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:9px 18px;font-size:14.5px;font-weight:700;cursor:pointer;color:var(--muted);transition:.18s;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .tab:hover{color:var(--ink);border-color:#cbd5e1}
  .tab.active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(14,152,227,.35)}
  .tab .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .tab.prio{border:2px solid #f0b429;background:linear-gradient(180deg,#fff7db,#fffdf5);color:#7a5200;font-weight:800;box-shadow:0 2px 10px rgba(240,180,41,.35)}
  .tab.prio:hover{box-shadow:0 4px 14px rgba(240,180,41,.5)}
  .tab.prio.active{background:linear-gradient(135deg,#0a6fa8,#0E98E3);color:#fff;border-color:#0E98E3;box-shadow:0 4px 14px rgba(14,152,227,.45)}
  .tab .star{color:#f0b429;font-size:13px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))} .tab.prio.active .star{color:#ffe08a}
  .tab-sep{width:0;align-self:stretch;border-inline-start:2px dashed #cbd5e1;margin:0 12px}
  .tab-note{max-width:1280px;margin:-8px auto 20px;padding:9px 16px;background:linear-gradient(90deg,#fff7db,#fffdf5);border:1px solid #f5d67a;border-radius:12px;font-size:13.5px;color:#7a5200}
  .tab-note b{color:#5c3d00}
  .gbadge{display:inline-block;margin-inline-start:10px;background:rgba(255,255,255,.24);color:#fff;font-size:12px;font-weight:800;padding:3px 12px;border-radius:20px;vertical-align:middle;backdrop-filter:blur(4px)}
  .panel{display:none;animation:fade .35s ease}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border-radius:16px;padding:24px;box-shadow:var(--shadow);margin-bottom:20px;border:1px solid var(--line)}
  .card h2{font-family:'Heebo',sans-serif;font-size:21px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px}
  .card h3{font-family:'Heebo',sans-serif;font-size:17px;font-weight:700;margin:18px 0 10px;color:var(--brand-dark)}
  .card .lead{color:var(--muted);font-size:14.5px;margin-bottom:14px}
  .ico{width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto;background:#e0f2fe;color:#0E98E3}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .ghead{display:flex;align-items:center;gap:16px;padding:20px 24px;border-radius:16px;color:#fff;margin-bottom:20px;box-shadow:var(--shadow)}
  .ghead .gicon{width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;flex:0 0 auto;overflow:hidden}
  .ghead .gicon.img{background:#fff;padding:6px 10px;width:auto;min-width:54px;max-width:160px}
  .ghead .gicon.img img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block}
  .ghead .gtitle{font-family:'Heebo',sans-serif;font-size:22px;font-weight:900;line-height:1.2}
  .ghead .gsub{font-size:13.5px;opacity:.92;margin-top:2px}
  .ghead .gstats{margin-inline-start:auto;display:flex;gap:22px;text-align:center;flex-wrap:wrap}
  .ghead .gstats .v{font-family:'Heebo',sans-serif;font-size:22px;font-weight:900;line-height:1}
  .ghead .gstats .k{font-size:12px;opacity:.9}
  .g-blue{background:linear-gradient(120deg,#0a6fa8,#0E98E3)}
  .g-purple{background:linear-gradient(120deg,#6d28d9,#8b5cf6)}
  .g-rose{background:linear-gradient(120deg,#be123c,#f43f5e)}
  .g-orange{background:linear-gradient(120deg,#c2410c,#f97316)}
  .g-teal{background:linear-gradient(120deg,#0f766e,#14b8a6)}
  .g-gray{background:linear-gradient(120deg,#475569,#64748b)}
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:9px;font-size:14px}
  .bar-lbl{flex:0 0 260px;text-align:right;font-weight:600;font-size:13.5px}
  .bar-track{flex:1;background:#eef2f7;border-radius:8px;height:24px;overflow:hidden;position:relative;direction:ltr}
  .bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--brand),#36b3f0);min-width:6px}
  .bar-val{flex:0 0 50px;font-weight:800;font-family:'Heebo',sans-serif;font-size:14px;color:var(--brand-dark)}
  ul.clean{list-style:none}
  ul.clean li{position:relative;padding:8px 22px 8px 0;font-size:14.5px;border-bottom:1px dashed var(--line)}
  ul.clean li:last-child{border-bottom:none}
  ul.clean li::before{content:"";position:absolute;right:4px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
  ul.clean.pos li::before{background:var(--pos)}
  ul.clean.neg li::before{background:var(--neg)}
  ul.clean.warn li::before{background:var(--mix)}
  .rank{counter-reset:r;list-style:none}
  .rank li{counter-increment:r;padding:8px 38px 8px 0;position:relative;font-size:14.5px;border-bottom:1px dashed var(--line)}
  .rank li:last-child{border-bottom:none}
  .rank li::before{content:counter(r);background:var(--brand);color:#fff;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;position:absolute;top:9px;right:2px}
  .quote{background:linear-gradient(180deg,#f8fafc,#fff);border-inline-start:4px solid var(--brand);border-radius:0 12px 12px 0;padding:13px 16px;margin-bottom:11px;font-size:14.5px;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .quote.neg{border-inline-start-color:var(--neg)}
  .quote.pos{border-inline-start-color:var(--pos)}
  .quote .qmeta{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--line)}
  th{background:#f8fafc;font-weight:800;font-size:13px;color:var(--muted)}
  tr:hover td{background:#f8fafc}
  .badge{display:inline-block;padding:3px 11px;border-radius:20px;font-size:12.5px;font-weight:800}
  .b-pos{background:var(--pos-bg);color:var(--pos)} .b-neg{background:var(--neg-bg);color:var(--neg)}
  .b-mix{background:var(--mix-bg);color:var(--mix)} .b-neu{background:var(--neu-bg);color:var(--neu)}
  .mentions{font-family:'Heebo',sans-serif;font-weight:800}
  .insight{border-radius:14px;padding:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
  .insight .ih{font-weight:800;font-family:'Heebo',sans-serif;font-size:15.5px;margin-bottom:7px;display:flex;align-items:center;gap:9px}
  .insight .num-badge{min-width:28px;height:28px;padding:0 6px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 auto;font-size:13px}
  .insight p{font-size:14px;color:#334155}
  .insight.op{border-top:3px solid var(--pos)} .insight.op .num-badge{background:var(--pos)}
  .insight.risk{border-top:3px solid var(--neg)} .insight.risk .num-badge{background:var(--neg)}
  .insight.threat{border-top:3px solid var(--mix)} .insight.threat .num-badge{background:var(--mix)}
  .callout{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:14px 16px;font-size:14px;margin:14px 0;display:flex;gap:10px;align-items:flex-start}
  .callout.crit{background:#fef2f2;border-color:#fecaca}
  .callout.good{background:#f0fdf4;border-color:#bbf7d0}
  .newbanner{background:linear-gradient(120deg,#fff7ed,#ffedd5);border:1px solid #fdba74;border-radius:14px;padding:16px 18px;margin-bottom:20px}
  .newbanner h3{font-family:'Heebo',sans-serif;font-size:16px;font-weight:900;color:#c2410c;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .newbanner ul{list-style:none}
  .newbanner li{position:relative;padding:5px 20px 5px 0;font-size:14px}
  .newbanner li::before{content:"✦";position:absolute;right:2px;color:#f97316;font-size:12px;top:7px}
  .pie-wrap{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .pie-svg{flex:0 0 auto}
  .pie-side{flex:1;min-width:260px}
  .pie-legend{flex:0 1 auto;min-width:240px}
  .pie-wrap .pie-exp{flex:1;min-width:220px;margin-top:0;align-self:center}
  .pie-leg{font-size:14px;margin-bottom:9px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .pie-leg .sw{width:14px;height:14px;border-radius:4px;display:inline-block;flex:0 0 auto;transform:translateY(2px)}
  .pie-leg b{font-family:'Heebo',sans-serif}
  .pie-names{color:var(--muted);font-size:12.5px}
  .pie-exp{font-size:14px;color:#334155;margin-top:12px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  /* מסגרת כהה לגרף + הדוגמאות שלו כיחידה אחת */
  .card.graphframe{background:linear-gradient(180deg,#102740,#0b1a2d);border:1px solid #26486b;color:#e6eef7;box-shadow:0 14px 36px rgba(6,16,30,.45)}
  .graphframe h2,.graphframe h3{color:#fff}
  .graphframe .lead,.graphframe .note,.graphframe .qmeta,.graphframe .pie-names{color:#9fb6cf}
  .graphframe .pie-leg{color:#e9f1fa}
  .graphframe .pie-exp{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:#d6e3f1}
  .graphframe .quote{background:rgba(255,255,255,.07);box-shadow:none;color:#eaf1f8}
  .graphframe .quote::before{color:rgba(255,255,255,.18)}
  .graphframe .ico{background:rgba(255,255,255,.14)!important;color:#fff!important}
  .graphframe .bar-track{background:rgba(255,255,255,.13)}
  .graphframe .bar-lbl{color:#e9f1fa}
  .graphframe .bar-val{color:#cfe3f5}
  .graphframe svg text{fill:#eaf1f8}
  .graphframe h3{border-top:1px solid rgba(255,255,255,.12);padding-top:14px;margin-top:18px}
  /* אייקוני תוכנות (צ'יפ ממותג) */
  .swico{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:var(--sc,#64748b);color:#fff;font-weight:800;font-family:'Heebo',sans-serif;flex:0 0 auto;box-shadow:0 1px 3px rgba(0,0,0,.22);line-height:1;overflow:hidden}
  .swico.img{background:#fff;padding:3px 6px;border:1px solid var(--line);width:auto;min-width:30px;max-width:150px}
  .swico.img img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block}
  .swico.big.img{width:auto;padding:4px 9px;max-width:180px}
  /* כפתור תמונה להשוואת מערכות + חץ מהבהב */
  .cmp-btn{display:flex;align-items:center;gap:12px;flex:0 0 auto;text-decoration:none}
  .cmp-img{height:70px;width:auto;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.30));transition:.18s}
  .cmp-btn:hover .cmp-img{transform:scale(1.05);filter:drop-shadow(0 10px 22px rgba(0,0,0,.42))}
  .cmp-arrow{display:flex;flex-direction:column;align-items:center;gap:5px}
  .cmp-arrow-lbl{background:#fff;color:#0a6fa8;font-size:12px;font-weight:800;padding:3px 11px;border-radius:20px;box-shadow:0 3px 10px rgba(0,0,0,.22);white-space:nowrap;animation:cmppulse 1.6s ease-in-out infinite}
  .cmp-chevs{display:flex;color:#fff;font-size:28px;font-weight:900;line-height:1;text-shadow:0 2px 7px rgba(0,0,0,.4)}
  .cmp-chevs i{font-style:normal;animation:cmpwave 1.2s ease-in-out infinite}
  .cmp-chevs i:nth-child(2){animation-delay:.15s} .cmp-chevs i:nth-child(3){animation-delay:.3s}
  @keyframes cmpwave{0%,100%{opacity:.3;transform:translateX(0)}50%{opacity:1;transform:translateX(-5px)}}
  @keyframes cmppulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .tdname{display:inline-flex;align-items:center;gap:9px}
  .pie-leg .swico{width:24px;height:24px;border-radius:7px;font-size:11px}
  /* כרטיסי מתחרים במבט */
  .spot{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:14px}
  .spot-card{border:1px solid var(--line);border-top:4px solid var(--sc,#64748b);border-radius:14px;padding:16px 12px;text-align:center;background:#fff;box-shadow:var(--shadow)}
  .spot-card .swico{width:48px;height:48px;border-radius:13px;font-size:20px;margin:0 auto 10px}
  .spot-name{font-weight:800;font-family:'Heebo',sans-serif;font-size:15px}
  .spot-sat{font-family:'Heebo',sans-serif;font-weight:900;font-size:28px;margin-top:4px;line-height:1}
  .spot-meta{font-size:12.5px;color:var(--muted);margin-top:4px}
  .newtag{display:inline-block;background:#fff7ed;color:#c2410c;border:1px solid #fdba74;font-size:10.5px;font-weight:800;padding:1px 8px;border-radius:20px;margin-inline-start:6px;vertical-align:middle}
  .note{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:8px}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 0 0;border-top:1px solid var(--line);margin-top:24px}
  @media(max-width:900px){
    .grid2,.grid3{grid-template-columns:1fr}
    .bar-lbl{flex-basis:150px}
    h1.title{font-size:26px}
    .ghead{flex-wrap:wrap}.ghead .gstats{margin-inline-start:0;width:100%;justify-content:space-around}
    .head-inner{flex-direction:column;align-items:flex-start}
    .head-logos{order:-1}
    .head-logos img{height:46px}
  }
</style>
</head>
<body>
<header class="top"><div class="head-inner">
  <div class="head-text">
    <div class="eyebrow">🛰️ מודיעין שוק · מסמך פנימי להנהלה</div>
    <h1 class="title" id="dTitle">דשבורד ניתוח קבוצות וואטסאפ</h1>
    <div class="subtitle" id="dSub"></div>
    <div class="head-meta" id="dMeta"></div>
  </div>
  <a class="cmp-btn" id="cmpBtn" href="comparison.html" title="למרכז מודיעין מוצר — השוואת מערכות"><span class="cmp-arrow"><span class="cmp-arrow-lbl">לחצו לצפייה</span><span class="cmp-chevs"><i>‹</i><i>‹</i><i>‹</i></span></span><img class="cmp-img" id="cmpImg" alt="השוואת מערכות מתחרות"></a>
  <div class="head-logos" id="headLogos"></div>
</div></header>
<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <div class="tabs" id="tabs"></div>
  <div class="tab-note">★ <b>מומלץ להתחיל כאן:</b> "סקירה ניהולית" ו"טכנולוגיה במשרדי רואי חשבון" מרכזות את התובנות בעלות הערך המוסף הגבוה ביותר — מודיעין תחרותי חוצה-שוק.</div>
  <div id="panels"></div>
  <footer id="foot"></footer>

מדריך תיקון/ביטול מסמכים לפי חוק ניהול ספרים</b> — מתי תאריך אסמכתא ניתן/לא ניתן לתיקון (פקודת יומן מול שיווק ומלאי), וזיכוי נגדי.", "<b>אשף קליטת דפי בנק לפי בנק</b> — פועלים/דיסקונט (DAT)/לאומי + התאמות מט\"ח וחד-צידיות שלא מעדכנות כרטיס ספק.", "<b>מדריך בדיקת כפילויות אמין</b> — אחידות מספר אסמכתא, כפילות מתקדמת, בדיקה אוטומטית בסגירת מנה.", "<b>ספריית פקודות יומן מוכנות</b> — נ0 בהתאמות, מטבעות/מט\"ח, קליטה מ-XL/קונטו, 856 חוצה-שנים.", "<b>מפת \"איפה זה\"</b> — פתיחת מייל לפני שליחה, קיבוע מחיר, חשבונות חסויים, רזולוציה, ייצוא לרו\"ח."]}]}, {"kind": "quotes", "title": "ציטוטים מילה במילה", "mode": "flat", "items": [{"text": "עשיתי עדכון גרסה, ומאז לא מצליחה להוריד טוקן של מספר הקצאה. מקבלת שגיאה 403... יודעת שאני לא היחידה.", "meta": "רגרסיה בעדכון הפוגעת בהפקת חשבוניות", "tone": "neg"}, {"text": "זה קרה בכל הורדה של הרף (זו השלישית כבר) ובאף פעם הם לא חשבו לתקן את זה.", "meta": "תקלה חוזרת שלא מטופלת", "tone": "neg"}, {"text": "לא כדאי, יש להם מלא באגים בשנה האחרונה.", "meta": "תפיסת איכות גרסאות", "tone": "neg"}, {"text": "תעשה לעצמך חיים קלים — תתחבר לביזיבוקס... יסגור לך יופי את נושא ההתאמות בנקים.", "meta": "לקוחות ממליצים זה לזה על צד-ג' (דליפת ערך)", "tone": ""}, {"text": "מישהו יכול לעזור ברישום מסמך אחר שיעבור ב-PCN. השירות של חשבשבת גרוע. אני מחכה כמה ימים שיעזרו לי.", "meta": "קריאה פתוחה כמה ימים ללא מענה", "tone": "neg", "added": "20260809-205109"}, {"text": "למה צריך לחכות למענה של חשבשבת שעות. אני תקועה באמצע עבודה. לפעמים גם ימים.", "meta": "זמן תגובה חוסם עבודה שוטפת", "tone": "neg", "added": "20260809-205109"}, {"text": "האם עוד מישהו נתקל בזה שכשפותחים קריאה חשבשבת שולחים מייל שחזרו כשבפועל לא חזרו, ואף סוגרים פנייה?", "meta": "טענה חדשה: סגירת פניות ללא מענה אמיתי", "tone": "neg", "added": "20260809-205109"}, {"text": "לייבא דפי בנק וכ.א זה כ\"כ שנות ה-80. יש בתי תוכנה שעושים את זה ברמה יומית.", "meta": "השוואה מזלזלת לקליטת בנק — דחיפה לצד-ג'", "tone": "neg", "added": "20260809-205109"}, {"text": "מה עושים בדוח PCN לגבי דרישה למספר הקצאות בג תב-בלבד.", "תועד <b>חיכוך אינטגרציה/הגירה</b>: משתמשים מנסים לקלוט קבצי הכנסות מחשבשבת ל-SUMIT תוך שימור מספר חשבונית ישראל.", "עלו שאלות תפעוליות ב-SUMIT ללא מענה בקבוצה: עדכון סוג רשומה למע\"מ (קופה קטנה) ותזמון תשלומי אשראי דרך יופיי."], "new_period": "2.8.2026", "sections": [{"kind": "callout", "kindClass": "crit", "icon": "🚨", "text": "<b>איום אסטרטגי + חלון שימור:</b> ב-SUMIT תועד <b>מעבר פעיל של לקוחות מחשבשבת</b> מונע <b>מחיר</b> ודרישה ל<b>ענן ואוטומציה</b>. במקביל נחשפת <b>חולשת שימור של SUMIT עצמה</b> — לקוחה חדשה מתוסכלת מהיעדר תמיכה טלפונית ומתחרטת על ההרשמה. נקודות הכאב התפעוליות של SUMIT נותרו <b>856</b> ואונבורדינג."}, {"kind": "lists", "columns": [{"title": "נקודות כאב וחולשות", "icon": "🔥", "icobg": "#fee2e2", "icocolor": "#dc2626", "style": "neg", "items": ["<b>תמיכה בהתכתבות בלבד</b> — \"קשה מאוד להגיע בטלפון\"; אושר שוב ע\"י לקוחה חדשה (\"חודשים רבים... ופשוט כלום\") ומשתמשת ותיקה; המתנה ~שעתיים; מאתגר לעובדים מבוגרים.", "<b>חרטה ותסכול לקוחות חדשים</b> — \"מתחרטת על כל רגע שנרשמתי\"; סיגנל נטישה מוקדם.", "<b>עקומת אונבורדינג</b> — \"עונש לקודד את כל המסמכים עד שהתוכנה תלמד\".", "<b>דיווח 856 / אישור ניכוי מס</b> — מבלבל; נענה דרך בוט/מרכז ידע ולא מענה אנושי מיידי.", "<b>באג מע\"מ</b> — תבנית ברירת מחדל חישבה 17% במקום 18%.", "<b>חיכוך הגירה/אינטגרציה</b> — קליטת קבצי הכנסות מחשבשבת ל-SUMIT ושימור מספר חשבונית ישראל אינם טריוויאליים.", "<b>API מוגבל</b> — \"יש API לתשלום למוסדות\" בלבד; שאלות AI/MCP ללא מענה ברור."]}, {"title": "הזדמנויות כיבוש לחשבשבת", "icon": "♟️", "icobg": "#dcfce7", "icocolor": "#16a34a", "style": "pos", "items": ["<b>שימור מול מחיר (דחוף)</b> — לקוחות עוזבים כי חשבשבת \"יקרה מאוד\"; נדרשת חבילת מחיר/ערך תחרותית.", "<b>כיבוש לקוחות SUMIT מתוסכלים</b> — חרטה טרייה של לקוחה חדשה על היעדר תמיכה טלפונית = פלח בשל למסר \"תמיכה אנושית בטלפון\".", "<b>להאיץ ענן + אוטומציה</b> — הדרישות המפורשות של העוזבים.", "<b>856 פשוט</b> — נותר נקודת כאב ב-SUMIT; מסר מבדל.", "<b>לטפח את אוהבי חשבשבת</b> — \"המון קיצורים שמקצרים זמן\" = יתרון פרודוקטיביות לשימור.", "<b>תמיכה אנושית מיידית</b> — בידול מול מודל הצ'אט של SUMIT (אך רק אם זמן התגובה ישתפר)."]}]}, {"kind": "quotes", "title": "ציטוטים מילה במילה", "mode": "flat", "items": [{"text": "האם בסאמיט אפשר לפצל תשלום בפקודות יומן, כמו האפשרות בחשבשבת?", "meta": "חשבשבת כאמת-מידה פונקציונלית", "tone": ""}, {"text": "שוקלת מעבר מחשבשבת לסאמיט משום שחשבשבת מאד יקרים... בסאמיט נתנו לי מחיר זעום לעומת חשבשבת עם ערך גדול פי כמה וכמה. נראה גם שהממשק של סאמיט פשוט ונוח.", "meta": "מעבר מונע-מחיר מחשבשבת — בהמשך כתבה \"שוכנעתי\"", "tone": "neg"}, {"text": "שעתיים זה בהחלט סביר. חשבשבת חוזרים לפעמים יום אחרי.", "meta": "שירות חשבשבת נתפס איטי אפילו מול SUMIT", "tone": "neg"}, {"text": "בינתיים זה נראה לי רק עונש לקודד את כל המסמכים עד שהתוכנה תלמד... אני מבחינתי ממש אוהבת את חשבשבת, יש בה המון קיצורים.", "meta": "עקומת אונבורדינג ב-SUMIT + נאמנות לקיצורי חשבשבת", "tone": ""}, {"text": "התמיכה ניתנת בהתכתבות, מאוד קשה להגיע אליהם בטלפון. אם יש עובדים מבוגרים, זה יכול לאתגר אותם.", "meta": "חולשת תמיכה של SUMIT (צ'אט בלבד)", "tone": "neg"}, {"text": "המערכת, בתבנית ברירת מחדל, לקחה 17% במקום 18% מע\"מ.", "meta": "באג מע\"מ בברירת מחדל ב-SUMIT", "tone": "neg"}, {"text": "עוד מישהו נתקל בחוסר מענה מכל כיוון אפשרי בתוכנה הזאת? כבר חודשים רבים שאני רק מחפשת מענה אנושי נורמלי בשיחת טלפון דבר מאוד מינימלי, ופשוט כלום.", "meta": "לקוחה חדשה ב-SUMIT — היעדר תמיכה טלפונית מזה חודשים", "tone": "neg", "added": "20260809-205109"}, {"text": "אני כבר מתוסכלת לגמרי, מתחרטת על כל רגע שנרשמתי.", "meta": "חרטה על ההרשמה ל-SUMIT (סיגנל נטישה)", "tone": "neg", "added": "20260809-205109"}, {"text": "רוב התמיכה ניתנת בכתב (אני עובדת איתם מעל חצי שנה).", "meta": "משתמשת ותיקה מאשרת: תמיכת SUMIT בכתב בלבד", "tone": "neg", "added": "20260809-205109"}, {"text": "האם מישהו קולט קבצי הכנסות מחשבשבת לסאמיט? באיזה קובץ, כדי שמספר חשבונית ישראל גם ייקלט.", "meta": "חיכוך אינטגרציה/הגירה — קליטת קבצי חשבשבת ל-SUMIT ושימור מספר חשבונית ישראל", "tone": "", "added": "20260809-205109"}], "callout": { const esc = s => (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const GMAP = {blue:'g-blue',purple:'g-purple',rose:'g-rose',orange:'g-orange',teal:'g-teal',gray:'g-gray'};
const DOT = {blue:'#0E98E3',purple:'#8b5cf6',rose:'#f43f5e',orange:'#f97316',teal:'#14b8a6',gray:'#64748b'};

function renderBlock(b){
  if(b.kind==='bars'){
    const max = Math.max(...b.data.map(d=>d.value),1);
    const rows = b.data.map(d=>`<div class="bar-row"><div class="bar-lbl">${esc(d.label)}</div><div class="bar-track"><div class="bar-fill" style="width:${(d.value/max*100).toFixed(1)}%"></div></div><div class="bar-val">${esc(d.value)}${esc(b.unit||'')}</div></div>`).join('');
    const ex=(b.examples||[]); const half=Math.ceil(ex.length/2);
    const exHtml=ex.length?`<h3>דוגמאות מתוך השיחות</h3><div class="grid2"><div>${ex.slice(0,half).map(q=>qhtml(q)).join('')}</div><div>${ex.slice(half).map(q=>qhtml(q)).join('')}</div></div>`:'';
    return `<div class="${b.frame?'card graphframe':'card'}"><h2><span class="ico">📊</span>${esc(b.title)}</h2>${b.lead?`<p class="lead">${esc(b.lead)}</p>`:''}${rows}${b.note?`<p class="note">${esc(b.note)}</p>`:''}${exHtml}</div>`;
  }
  if(b.kind==='sentiment_table'){
    const rows = b.rows.map(r=>`<tr${r.star?' style="background:#eff6ff"':''}><td><span class="tdname">${r.icon||''}<b>${esc(r.name)}</b></span>${r.star?' ⭐':''}${isNew(r.added)?NEWTAG:''}</td><td class="mentions">${esc(r.mentions)}</td><td><span class="badge ${r.sentiment.kind}">${esc(r.sentiment.label)}</span></td><td>${esc(r.note||'')}</td></tr>`).join('');
    return `<div class="card"><h2><span class="ico">🏷️</span>${esc(b.title)}</h2>${b.lead?`<p class="lead">${esc(b.lead)}</p>`:''}<table><thead><tr><th>תוכנה</th><th>אזכורים</th><th>סנטימנט</th><th>תמצית</th></tr></thead><tbody>${rows}</tbody></table>${b.note?`<p class="note">${esc(b.note)}</p>`:''}</div>`;
  }
  if(b.kind==='table'){
    const head = b.columns.map(c=>`<th>${esc(c)}</th>`).join('');
    const rows = b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('');
    return `<div class="card"><h2><span class="ico">🗺️</span>${esc(b.title)}</h2>${b.lead?`<p class="lead">${esc(b.lead)}</p>`:''}<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  if(b.kind==='lists'){
    const cols = b.columns.map(col=>{
      const cls = col.style==='pos'?'pos':col.style==='neg'?'neg':col.style==='warn'?'warn':'';
      const items = col.ranked
        ? `<ol class="rank">${col.items.map(i=>`<li>${i}</li>`).join('')}</ol>`
        : `<ul class="clean ${cls}">${col.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
      return `<div class="card"><h2><span class="ico" style="background:${col.icobg||'#e0f2fe'};color:${col.icocolor||'#0E98E3'}">${col.icon||'•'}</span>${esc(col.title)}</h2>${items}</div>`;
    }).join('');
    return b.columns.length>1?`<div class="grid2">${cols}</div>`:cols;
  }
  if(b.kind==='quotes'){
    let inner='';
    if(b.mode==='split'){
      inner = `<div class="grid2"><div><h3 style="color:var(--pos)">👍 חיובי</h3>${(b.pos||[]).map(q=>qhtml(q,'pos')).join('')}</div><div><h3 style="color:var(--neg)">👎 שלילי</h3>${(b.neg||[]).map(q=>qhtml(q,'neg')).join('')}</div></div>`;
    } else {
      const half=Math.ceil((b.items||[]).length/2);
      const a=(b.items||[]).slice(0,half).map(q=>qhtml(q)).join('');
      const c=(b.items||[]).slice(half).map(q=>qhtml(q)).join('');
      inner = `<div class="grid2"><div>${a}</div><div>${c}</div></div>`;
    }
    const co = b.callout?`<div class="callout ${b.callout.kind||''}"><span>${b.callout.icon||'🚨'}</span><div>${b.callout.text}</div></div>`:'';
    const nt = b.note?`<p class="note">${b.note}</p>`:'';
    return `<div class="card"><h2><span class="ico" style="background:#fef3c7;color:#d97706">💬</span>${esc(b.title)}</h2>${inner}${co}${nt}</div>`;
  }
  if(b.kind==='insights'){
    const cards = b.cards.map(c=>`<div class="insight ${c.kind||''}"><div class="ih"><span class="num-badge">${esc(c.badge||'•')}</span>${esc(c.title)}${c.new?NEWTAG:''}</div><p>${c.body}</p></div>`).join('');
    const g = b.cards.length>=5?'grid3':'grid2';
    return `<div class="card"><h2><span class="ico" style="background:#ede9fe;color:#7c3aed">🧭</span>${esc(b.title)}</h2>${b.lead?`<p class="lead">${esc(b.lead)}</p>`:''}<div class="${g}">${cards}</div></div>`;
  }
  if(b.kind==='callout'){
    return `<div class="callout ${b.kindClass||''}"><span>${b.icon||'🎯'}</span><div>${b.text}</div></div>`;
  }
  if(b.kind==='spotlight'){
    const tc=v=>v>=75?'#16a34a':(v>=45?'#d97706':'#dc2626');
    const cards=(b.cards||[]).map(c=>`<div class="spot-card" style="--sc:${c.color}">${c.icon||''}<div class="spot-name">${esc(c.name)}</div><div class="spot-sat" style="color:${tc(c.sat)}">${esc(c.sat)}%</div><div class="spot-meta">${esc(c.pos)}👍 ${esc(c.neg)}👎</div></div>`).join('');
    return `<div class="card"><h2><span class="ico" style="background:#fef3c7;color:#d97706">🏆</span>${esc(b.title)}</h2>${b.lead?`<p class="lead">${esc(b.lead)}</p>`:''}<div class="spot">${cards}</div></div>`;
  }
  if(b.kind==='trend'){
    const data=b.data||[]; if(!data.length) return '';
    const W=820,H=240,pl=34,pr=14,pt=16,pb=34;
    const max=Math.max(...data.map(d=>d.value),1), n=data.length;
    const iw=W-pl-pr, ih=H-pt-pb;
    const X=i=>pl+(n<=1?iw/2:iw*i/(n-1)), Y=v=>pt+ih-(v/max*ih);
    const pts=data.map((d,i)=>[X(i),Y(d.value)]);
    const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const area=line+` L${X(n-1).toFixed(1)} ${(pt+ih).toFixed(1)} L${X(0).toFixed(1)} ${(pt+ih).toFixed(1)} Z`;
    const grid=[0,.5,1].map(f=>{const gy=(pt+ih-f*ih).toFixed(1);return `<line x1="${pl}" y1="${gy}" x2="${W-pr}" y2="${gy}" stroke="rgba(255,255,255,.14)"/><text x="${pl-6}" y="${(+gy+3)}" text-anchor="end" font-size="10" fill="#9fb6cf">${Math.round(max*f)}</text>`;}).join('');
    const step=Math.max(1,Math.ceil(n/8));
    const xl=data.map((d,i)=>i%step===0?`<text x="${X(i).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="10" fill="#9fb6cf">${esc(d.label)}</text>`:'').join('');
    const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="#36b3f0"><title>${esc(data[i].label)}: ${esc(data[i].value)} הודעות</title></circle>`).join('');
    const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;direction:ltr" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#36b3f0" stop-opacity=".45"/><stop offset="1" stop-color="#36b3f0" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="#36b3f0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}</svg>`;
    return `<div class="${b.frame?'card graphframe':'card'}"><h2><span class="ico">📈</span>${esc(b.title)}</h2>${b.lead?`<p class="lead">${esc(b.lead)}</p>`:''}<div style="overflow-x:auto">${svg}</div>${b.note?`<p class="note">${esc(b.note)}</p>`:''}</div>`;
  }
  if(b.kind==='pie'){
    const sv=x=>(x.size!=null?x.size:x.value);
    const segs=(b.segments||[]).filter(s=>sv(s)>0);
    const total=segs.reduce((a,x)=>a+sv(x),0)||1;
    const R=85,r=50,cx=100,cy=100;
    const pol=(deg,rad)=>[cx+rad*Math.cos(deg*Math.PI/180),cy+rad*Math.sin(deg*Math.PI/180)];
    let arcs='';
    if(segs.length===1){
      arcs=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${segs[0].color}" stroke-width="${R-r}"/>`;
    } else {
      let ang=-90;
      arcs=segs.map(s=>{
        const a0=ang,a1=ang+(sv(s)/total)*360; ang=a1;
        const big=(a1-a0)>180?1:0;
        const A0=pol(a0,R),A1=pol(a1,R),B1=pol(a1,r),B0=pol(a0,r);
        return `<path d="M${A0[0].toFixed(1)} ${A0[1].toFixed(1)} A${R} ${R} 0 ${big} 1 ${A1[0].toFixed(1)} ${A1[1].toFixed(1)} L${B1[0].toFixed(1)} ${B1[1].toFixed(1)} A${r} ${r} 0 ${big} 0 ${B0[0].toFixed(1)} ${B0[1].toFixed(1)} Z" fill="${s.color}" stroke="#fff" stroke-width="1.5"/>`;
      }).join('');
    }
    const cv = b.center_value!=null ? b.center_value : total;
    const cs = b.center_sub!=null ? b.center_sub : 'אזכורים';
    const svg=`<svg viewBox="0 0 200 200" style="width:210px;height:210px;direction:ltr">${arcs}<text x="100" y="95" text-anchor="middle" font-size="26" font-weight="900" fill="#16202e" font-family="Heebo,sans-serif">${esc(cv)}</text><text x="100" y="116" text-anchor="middle" font-size="11" fill="#64748b">${esc(cs)}</text></svg>`;
    const legend=segs.map(s=>`<div class="pie-leg">${s.icon||('<span class="sw" style="background:'+s.color+'"></span>')}<b>${esc(s.label)}${s.sub?'':' — '+Math.round(s.value/total*100)+'%'}</b>${s.sub?`<span class="pie-names">${esc(s.sub)}</span>`:''}${s.names&&s.names.length?`<span class="pie-names">${s.names.map(esc).join(' · ')}</span>`:''}</div>`).join('');
    const ex=(b.examples||[]);
    const half=Math.ceil(ex.length/2);
    const exHtml=ex.length?`<h3>דוגמאות מתוך השיחות</h3><div class="grid2"><div>${ex.slice(0,half).map(q=>qhtml(q)).join('')}</div><div>${ex.slice(half).map(q=>qhtml(q)).join('')}</div></div>`:'';
    return `<div class="${b.frame?'card graphframe':'card'}"><h2><span class="ico" style="background:#ede9fe;color:#7c3aed">🥧</span>${esc(b.title)}</h2>${b.lead?`<p class="lead">${esc(b.lead)}</p>`:''}
      <div class="pie-wrap"><div class="pie-svg">${svg}</div><div class="pie-legend">${legend}</div>${b.exp?`<div class="pie-exp">${b.exp}</div>`:''}</div>
      ${exHtml}</div>`;
  }
  return '';
}
function isNew(added){ return added && added===DATA.meta.build_stamp; }
const NEWTAG = '<span class="newtag">🆕 חדש</span>';
function qhtml(q,tone){
  const t = tone||q.tone||'';
  return `<div class="quote ${t}">${esc(q.text)}${isNew(q.added)?NEWTAG:''}${q.meta?`<div class="qmeta">— ${esc(q.meta)}</div>`:''}</div>`;
}

// header
document.getElementById('dSub').textContent = DATA.meta.subtitle||'ניתוח ניהולי של קבוצות מקצועיות · עבור הנהלת חשבשבת';
document.getElementById('dMeta').innerHTML = (DATA.meta.chips||[]).map(c=>`<span>${esc(c)}</span>`).join('');
document.getElementById('headLogos').innerHTML = (DATA.meta.logos||[]).map(l=>`<img src="${l.src}" alt="${esc(l.alt||'')}">`).join('');
// כפתור תמונת השוואת מערכות
const cmpBtn=document.getElementById('cmpBtn'), cmpImg=document.getElementById('cmpImg');
if(DATA.meta.compare_btn){ cmpImg.src=DATA.meta.compare_btn; } else if(cmpBtn){ cmpBtn.style.display='none'; }
// גובה הלוגואים = שתי שורות הכותרת; כפתור ההשוואה בגובה פי 2 ורוחב מוגדל ×1.3 (קריאות)
const CMP_WIDEN=1.3;
function sizeLogos(){
  const t=document.getElementById('dTitle'), s=document.getElementById('dSub');
  if(!t||!s) return;
  const h=Math.round(s.getBoundingClientRect().bottom - t.getBoundingClientRect().top);
  if(h>0){
    document.querySelectorAll('.head-logos img').forEach(im=>im.style.height=h+'px');
    if(cmpImg){
      const H=h*2; cmpImg.style.height=H+'px';
      const ar=(cmpImg.naturalWidth&&cmpImg.naturalHeight)?cmpImg.naturalWidth/cmpImg.naturalHeight:1;
      cmpImg.style.width=Math.round(H*ar*CMP_WIDEN)+'px';
    }
  }
}
if(cmpImg) cmpImg.addEventListener('load', sizeLogos);
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(sizeLogos);
window.addEventListener('resize', sizeLogos);
setTimeout(sizeLogos, 300);
// kpis
const kp = document.getElementById('kpis');
kp.style.gridTemplateColumns = `repeat(${Math.min(DATA.meta.kpis.length,5)},1fr)`;
const kpColors=['var(--brand)','var(--purple)','var(--teal)','var(--rose)','var(--amber)'];
kp.innerHTML = DATA.meta.kpis.map((k,i)=>`<div class="kpi" style="border-top-color:${kpColors[i%5]}"><div class="num" style="color:${kpColors[i%5]}">${esc(k.num)}</div><div class="lbl">${esc(k.lbl)}</div></div>`).join('');
// tabs + panels
const tabs=document.getElementById('tabs'), panels=document.getElementById('panels');
let prevPrio=false;
DATA.groups.forEach((g,idx)=>{
  if(prevPrio && !g.priority){const sep=document.createElement('span');sep.className='tab-sep';tabs.appendChild(sep);}
  prevPrio=!!g.priority;
  const dot = DOT[g.color]||'#0E98E3';
  const tab=document.createElement('div');
  tab.className='tab'+(idx===0?' active':'')+(g.priority?' prio':'');
  tab.innerHTML=`${g.priority?'<span class="star">★</span>':''}<span class="dot" style="background:${dot}"></span>${esc(g.tabLabel||g.name)}`;
  tab.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));tab.classList.add('active');document.getElementById('panel-'+idx).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});};
  tabs.appendChild(tab);

  const p=document.createElement('div');
  p.className='panel'+(idx===0?' active':'');
  p.id='panel-'+idx;
  let html='';
  {
    const gc=GMAP[g.color]||'g-blue';
    const stats=(g.stats||[]).map(s=>`<div><div class="v">${esc(s.v)}</div><div class="k">${esc(s.k)}</div></div>`).join('');
    const gicon = g.icon_img ? `<div class="gicon img${g.icon_plain?' plain':''}"><img src="${g.icon_img}" alt=""></div>` : `<div class="gicon">${esc(g.icon||'•')}</div>`;
    html+=`<div class="ghead ${gc}">${gicon}<div><div class="gtitle">${esc(g.name)}${g.badge?`<span class="gbadge">${esc(g.badge)}</span>`:''}</div><div class="gsub">${esc(g.sub||'')}</div></div><div class="gstats">${stats}</div></div>`;
  }
  (g.top_sections||[]).forEach(b=>html+=renderBlock(b));
  if(g.new_highlights && g.new_highlights.length){
    html+=`<div class="newbanner"><h3>🆕 מה התווסף בהרצה האחרונה${g.new_period?` (${esc(g.new_period)})`:''}</h3><ul>${g.new_highlights.map(h=>`<li>${h}</li>`).join('')}</ul></div>`;
  }
  (g.sections||[]).forEach(b=>html+=renderBlock(b));
  p.innerHTML=html;
  panels.appendChild(p);
});
document.getElementById('foot').innerHTML = (DATA.meta.footer||'מסמך פנימי להנהלת חשבשבת · מספרי טלפון עברו אנונימיזציה · ציטוטים מתוך תוכן הקבוצות');
</script>
</body>
